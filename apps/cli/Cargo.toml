[package]
name = "holocron"
version = "0.1.0"
edition = "2021"

[dependencies]
chrono = "0.4.43"
clap = { version = "4", features = ["derive"] }
dirs = "6"
hex = "0.4.3"
mime_guess = "2.0.5"
notify = "7"
reqwest = { version = "0.13.2", default-features = false, features = ["json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.9"
thiserror = "2.0.18"
tokio = { version = "1", features = ["full"] }

[dev-dependencies]
tempfile = "3.25.0"

